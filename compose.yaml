services:
  web:
    build: .
    image: analizador-representacion:1.0
    container_name: analizador
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: "cambia-esta-clave-antes-de-publicar"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,[::1]"
      DJANGO_DEBUG: "0"
    # Límites de recursos pedidos en el ejercicio
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
